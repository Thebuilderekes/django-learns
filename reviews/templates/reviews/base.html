{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %} {%endblock %}</title>
    <link rel="stylesheet" href="{% static 'reviews/css/styles.css' %}" />
    <link rel="stylesheet" href="{% static 'reviews/css/search.css' %}" />
    <link rel="stylesheet" href="{% static 'reviews/css/index.css' %}" />
    <link rel="stylesheet" href="{% static 'reviews/js/script.js' %}" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <nav>
      <div class="nav-container">
        <a href="/" class="logo">BookReview</a>
        <ul class="nav-links">
          <li><a href="/books/">Browse Books</a></li>
          <li><a href="/reviews/">Reviews</a></li>
          <li><a href="/about/">About</a></li>
          {% if user.is_authenticated %}
            <li><a href="/accounts/profile/">Profile</a></li>
            <li><a href="/logout/" class="btn btn-outline">Logout</a></li>
          {% else %}
            <li><a href="/login/" class="btn btn-primary">Login</a></li>
          {% endif %}
        </ul>
      </div>
    </nav>

    <main>
        <h1>
          {% block heading %} {% endblock heading %}
        </h1>
      {% block content %}{% endblock %}
    </main>

    <script>

    {%block script %} {%endblock script%}
    </script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
