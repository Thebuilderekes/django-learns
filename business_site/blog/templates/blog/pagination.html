<nav class="pagination-container flex center" aria-label="Blog pages">
  <ul class="pagination flex center gap-4">

    {% if page.has_previous %}
      <li class="page-item">
        <a href="?page={{ page.previous_page_number }}" class="page-link">Previous</a>
      </li>
    {% endif %}

    <li class="page-item current-info">
      <span class="page-link">
        Page {{ page.number }} of {{ page.paginator.num_pages }}
      </span>
    </li>

    {% if page.has_next %}
      <li class="page-item">
        <a href="?page={{ page.next_page_number }}" class="page-link">Next</a>
      </li>
    {% endif %}

  </ul>
</nav>
